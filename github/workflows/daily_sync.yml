name: Nightly BSE Watchlist Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '31 18 * * *'

jobs:
  sync-watchlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Watchlist Sync
        env:
          WORKER_URL: "https://bse-financial-analyzer.daksheshpatelin.workers.dev"
        run: python sync_watchlist.py
